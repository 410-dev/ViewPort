[package]
name = "vp-driver"
description = "ViewPort storage driver abstraction and built-in drivers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
smb2 = { version = "0.31", optional = true }
thiserror.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["smb"]
smb = ["dep:smb2", "dep:tokio"]

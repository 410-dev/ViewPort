[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
vp-core = { path = "crates/vp-core" }
vp-query = { path = "crates/vp-query" }
vp-db = { path = "crates/vp-db" }
vp-driver = { path = "crates/vp-driver" }
vp-bundle = { path = "crates/vp-bundle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled", "collation"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

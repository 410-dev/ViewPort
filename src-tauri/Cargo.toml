[package]
name = "viewport"
version = "0.1.0"
description = "ViewPort media manager"
authors = ["ViewPort"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "viewport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
vp-core.workspace = true
vp-query.workspace = true
vp-db.workspace = true
vp-driver.workspace = true
vp-bundle.workspace = true
tauri-plugin-dialog = "2.8.3"
tokio = { version = "1.53.3", features = ["sync"] }

thiserror.workspace = true
vp-scan.workspace = true
vp-thumb.workspace = true
vp-cache.workspace = true
vp-media.workspace = true
vp-crypto.workspace = true
vp-shard.workspace = true
vp-ml.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3"

# System-wide restore shortcut for the panic key (desktop only).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
# Image analysis runs models on desktop GPUs; phones only show its results.
vp-ml = { workspace = true, features = ["onnx"] }
# Model downloads (desktop).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# Optional HEIF decoder (libheif), loaded at run time and checked against its manifest.
libloading = "0.9"

# Lowering background threads' OS priority (`sched`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# OS credential stores for driver secrets (network passwords never go into the bundle).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Safe-area colors around the WebView (`platform::ios`).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", features = ["UIColor", "UIResponder", "UIView", "UIWindow", "UIInterface"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

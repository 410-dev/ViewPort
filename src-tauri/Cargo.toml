[package]
name = "viewport"
version = "0.1.0"
description = "ViewPort media manager"
authors = ["ViewPort"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "viewport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
vp-core.workspace = true
vp-query.workspace = true
vp-db.workspace = true
vp-driver.workspace = true
vp-bundle.workspace = true
tauri-plugin-dialog = "2.8.3"
tokio = { version = "1.53.3", features = ["sync"] }

thiserror.workspace = true
vp-scan.workspace = true
vp-thumb.workspace = true
vp-cache.workspace = true
vp-media.workspace = true

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
